plugins {
    id 'fabric-loom' version '1.6.12'
}

group = 'net.shoreline'
version = '1.0'
base { archivesName = 'shoreline' }

repositories {
    mavenCentral()
    maven { url 'https://impactdevelopment.github.io/maven/' }
}

loom {
    accessWidenerPath = file('src/main/resources/shoreline.accesswidener')
    mixin { defaultRefmapName = 'shoreline-refmap.json' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1'
    modImplementation 'cabaletta:baritone-api:1.2'
    include(modImplementation('io.github.llamalad7:mixinextras-fabric:0.4.0'))
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
